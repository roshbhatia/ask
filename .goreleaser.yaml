version: 2

before:
  hooks:
    - go run ./cmd/ask generate --check
    - mkdir -p completions
    - sh -c 'go run ./cmd/ask completion bash > completions/ask.bash'
    - sh -c 'go run ./cmd/ask completion fish > completions/ask.fish'
    - sh -c 'go run ./cmd/ask completion nu > completions/ask.nu'
    - sh -c 'go run ./cmd/ask completion zsh > completions/ask.zsh'

builds:
  - id: ask
    main: ./cmd/ask
    binary: ask
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux]
    goarch: [amd64, arm64]
archives:
  - id: ask
    ids: [ask]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - src: completions/*
        dst: completions
      - src: schema/*.cue
        dst: schema
      - src: schema/*.json
        dst: schema

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
